<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moukthika's Birthday Surprise 🎁</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #ffb6c1,
                #ffd6e0,
                #ffe4ec
            );

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            overflow: hidden;
        }

        .container {
            width: 95%;
            max-width: 1100px;
        }

        h1 {
            font-size: 48px;
            color: #d6336c;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 22px;
            line-height: 1.5;
            color: #6d214f;
            margin-bottom: 40px;
        }

        .name {
            color: #c2185b;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: 150px;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;

            transition: transform 0.8s;

            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;

            width: 100%;
            height: 100%;

            border-radius: 22px;

            backface-visibility: hidden;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.15);
        }

        /* FRONT */

        .card-front {
            background: white;

            border: 5px solid #ff5c8a;

            transition: 0.3s;
        }

        .card:hover .card-front {
            transform: translateY(-8px);

            box-shadow:
                0 18px 35px rgba(214, 51, 108, 0.25);
        }

        .gift {
            font-size: 55px;
            margin-bottom: 12px;
        }

        .card-front h2 {
            font-size: 38px;
            color: #d6336c;
        }

        /* BACK */

        .card-back {
            background:
                linear-gradient(
                    135deg,
                    #ff4081,
                    #d63384
                );

            color: white;

            transform: rotateY(180deg);
        }

        .number {
            font-size: 70px;
            font-weight: bold;
        }

        .card-back p {
            font-size: 17px;
            margin-top: 5px;
        }

        /* MESSAGE */

        .message {
            margin-top: 40px;

            font-size: 25px;

            color: #7b1e4b;

            font-weight: bold;
        }

        /* RESET BUTTON */

        .reset {
            margin-top: 20px;

            padding: 13px 28px;

            border: none;

            border-radius: 30px;

            background: #d6336c;

            color: white;

            font-size: 16px;

            cursor: pointer;

            display: none;
        }

        .reset:hover {
            background: #b52a59;
        }

        /* FLOATING HEARTS */

        .heart {
            position: absolute;

            font-size: 25px;

            animation:
                float 5s linear infinite;

            opacity: 0.7;

            pointer-events: none;
        }

        @keyframes float {

            0% {
                transform:
                    translateY(100vh)
                    rotate(0deg);

                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(-10vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

        /* CONFETTI */

        .confetti {
            position: fixed;

            width: 10px;
            height: 10px;

            top: -20px;

            animation:
                fall 3s linear forwards;

            pointer-events: none;
        }

        @keyframes fall {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(720deg);
            }
        }

        /* MOBILE */

        @media (max-width: 700px) {

            h1 {
                font-size: 34px;
            }

            .subtitle {
                font-size: 18px;
            }

            .cards {
                gap: 15px;
            }

            .card {
                width: 115px;
                height: 160px;
            }

            .gift {
                font-size: 42px;
            }

            .card-front h2 {
                font-size: 30px;
            }

            .number {
                font-size: 50px;
            }

            .card-back p {
                font-size: 14px;
            }

            .message {
                font-size: 20px;
            }
        }

    </style>
</head>


<body>

    <div class="container">

        <!-- TITLE -->

        <h1>
            🎂 Happy Birthday,
            <span class="name">Moukthika</span>!
            🎀
        </h1>


        <!-- INTRO -->

        <p class="subtitle">

            I have a little surprise for you... 💗

            <br>

            Choose <b>ONE</b> mystery box! 🎁

        </p>


        <!-- CARDS -->

        <div class="cards">

            <!-- CARD 1 -->

            <div
                class="card"
                onclick="flipCard(this)"
            >

                <div class="card-inner">

                    <div class="card-front">

                        <div class="gift">
                            🎁
                        </div>

                        <h2>
                            1
                        </h2>

                    </div>


                    <div class="card-back">

                        <div class="number">
                        </div>

                        <p>
                            Your Lucky Number ✨
                        </p>

                    </div>

                </div>

            </div>


            <!-- CARD 2 -->

            <div
                class="card"
                onclick="flipCard(this)"
            >

                <div class="card-inner">

                    <div class="card-front">

                        <div class="gift">
                            🎁
                        </div>

                        <h2>
                            2
                        </h2>

                    </div>


                    <div class="card-back">

                        <div class="number">
                        </div>

                        <p>
                            Your Lucky Number ✨
                        </p>

                    </div>

                </div>

            </div>


            <!-- CARD 3 -->

            <div
                class="card"
                onclick="flipCard(this)"
            >

                <div class="card-inner">

                    <div class="card-front">

                        <div class="gift">
                            🎁
                        </div>

                        <h2>
                            3
                        </h2>

                    </div>


                    <div class="card-back">

                        <div class="number">
                        </div>

                        <p>
                            Your Lucky Number ✨
                        </p>

                    </div>

                </div>

            </div>


            <!-- CARD 4 -->

            <div
                class="card"
                onclick="flipCard(this)"
            >

                <div class="card-inner">

                    <div class="card-front">

                        <div class="gift">
                            🎁
                        </div>

                        <h2>
                            4
                        </h2>

                    </div>


                    <div class="card-back">

                        <div class="number">
                        </div>

                        <p>
                            Your Lucky Number ✨
                        </p>

                    </div>

                </div>

            </div>


            <!-- CARD 5 -->

            <div
                class="card"
                onclick="flipCard(this)"
            >

                <div class="card-inner">

                    <div class="card-front">

                        <div class="gift">
                            🎁
                        </div>

                        <h2>
                            5
                        </h2>

                    </div>


                    <div class="card-back">

                        <div class="number">
                        </div>

                        <p>
                            Your Lucky Number ✨
                        </p>

                    </div>

                </div>

            </div>

        </div>


        <!-- MESSAGE -->

        <div class="message">

            Pick your number... 😈💗

        </div>


        <!-- RESET -->

        <button
            class="reset"
            onclick="location.reload()"
        >

            🔄 Play Again

        </button>

    </div>


    <script>

        let alreadyClicked = false;


        function flipCard(card) {

            /*
                Only one card can be selected.
            */

            if (alreadyClicked) {

                return;

            }


            alreadyClicked = true;


            /*
                Generate random number
                between 1 and 5.
            */

            let randomNumber =
                Math.floor(
                    Math.random() * 5
                ) + 1;


            /*
                Show the random number
                on the back.
            */

            card.querySelector(
                ".number"
            ).innerText = randomNumber;


            /*
                Flip the card.
            */

            card.classList.add(
                "flipped"
            );


            /*
                Change message.
            */

            document.querySelector(
                ".message"
            ).innerHTML =

                "🎉 Moukthika's lucky number is "
                + randomNumber
                + "! 🎁💗";


            /*
                Show replay button.
            */

            document.querySelector(
                ".reset"
            ).style.display = "inline-block";


            /*
                Start confetti.
            */

            createConfetti();

        }


        /* FLOATING HEARTS */

        function createHeart() {

            const heart =
                document.createElement(
                    "div"
                );


            heart.classList.add(
                "heart"
            );


            heart.innerHTML =
                "💗";


            heart.style.left =
                Math.random() * 100
                + "vw";


            heart.style.animationDuration =
                (3 + Math.random() * 4)
                + "s";


            document.body.appendChild(
                heart
            );


            setTimeout(
                () => {
                    heart.remove();
                },
                7000
            );

        }


        setInterval(
            createHeart,
            500
        );


        /* CONFETTI */

        function createConfetti() {

            for (
                let i = 0;
                i < 100;
                i++
            ) {

                const confetti =
                    document.createElement(
                        "div"
                    );


                confetti.classList.add(
                    "confetti"
                );


                confetti.innerHTML =
                    ["🎉", "💗", "✨", "🎀", "🎊"][
                        Math.floor(
                            Math.random() * 5
                        )
                    ];


                confetti.style.left =
                    Math.random() * 100
                    + "vw";


                confetti.style.animationDelay =
                    Math.random() * 2
                    + "s";


                confetti.style.fontSize =
                    (10 + Math.random() * 20)
                    + "px";


                document.body.appendChild(
                    confetti
                );


                setTimeout(
                    () => {
                        confetti.remove();
                    },
                    5000
                );

            }

        }

    </script>

</body>

</html>
